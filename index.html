<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Task Reminder</title>
  <meta name="description" content="Tareas periódicas que se reinician solas cada semana, mes, trimestre, semestre y año." />
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tareas" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Aplica el tema antes de pintar para evitar parpadeos.
    try {
      var t = localStorage.getItem('tr-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"><p class="fatal">Cargando…</p></div>
  <noscript><p class="fatal">Esta aplicación necesita JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
